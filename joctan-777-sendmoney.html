<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:#0B8A3E;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;gap:12px}.card{background:#fff;padding:30px;border-radius:16px;width:90%;max-width:400px;text-align:center}.card h1{color:#0B8A3E}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0}.btn{background:#0B8A3E;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;width:100%;cursor:pointer}.langBar{background:#fff;padding:10px 14px;border-radius:20px;font-weight:700}.langBar select{padding:8px 12px;border-radius:20px;font-weight:700;border:2px solid #0B8A3E}</style></head><body>
<div class="langBar">🌍 <b data-t="lang_label">Hindura Ururimi:</b> <select id="siteLang" onchange="changeSiteLang()"><option value="Kirundi">Kirundi</option><option value="Français">Français</option><option value="English">English</option><option value="Kinyarwanda">Kinyarwanda</option><option value="Kiswahili">Kiswahili</option><option value="Lingala">Lingala</option><option value="Luganda">Luganda</option></select></div>
<div class="card" id="loginCard"><h1 data-t="admin">🔐 Admin</h1><p style="font-size:13px;color:#666" data-t="admin_sub">SendMoney - Gusa wewe • Block 4 → 30min</p><input id="adminPass" type="password" placeholder="Password ya Admin"><input id="adminCode" type="password" placeholder="Code 2FA (1357)" maxlength="4" inputmode="numeric"><button class="btn" type="button" onclick="adminLogin()" data-t="login_btn">Injira →</button><p id="adminMsg" style="font-weight:700;margin-top:10px"></p><a href="/" style="color:#0B8A3E" data-t="back">← Garuka kuri Home</a></div>
<div class="card" id="adminDash" style="display:none"><h1 data-t="welcome">✅ Urakaza neza Admin!</h1><button class="btn" onclick="location.href='admin.html'" data-t="go_admin">👉 Jya muri Admin Dashboard</button><button class="btn" style="background:#FFD700;color:#000;margin-top:10px" onclick="logout()" data-t="logout">🚪 Sohoka</button></div>
<script>const T={Kirundi:{lang_label:'Hindura Ururimi:',admin:'🔐 Admin',admin_sub:'SendMoney - Gusa wewe • Block 4 → 30min',login_btn:'Injira →',back:'← Garuka kuri Home',welcome:'✅ Urakaza neza Admin!',go_admin:'👉 Jya muri Admin Dashboard',logout:'🚪 Sohoka'},Français:{lang_label:'Changer la Langue:',admin:'🔐 Admin',admin_sub:'SendMoney - Toi seulement • Bloc 4 → 30min',login_btn:'Se connecter →',back:'← Retour à l’Accueil',welcome:'✅ Bienvenue Admin!',go_admin:'👉 Aller au Tableau Admin',logout:'🚪 Déconnexion'},English:{lang_label:'Change Language:',admin:'🔐 Admin',admin_sub:'SendMoney - Only you • Block 4 → 30min',login_btn:'Login →',back:'← Back to Home',welcome:'✅ Welcome Admin!',go_admin:'👉 Go to Admin Dashboard',logout:'🚪 Logout'},Kinyarwanda:{lang_label:'Hindura Ururimi:',admin:'🔐 Admin',admin_sub:'SendMoney - Wowe gusa • Block 4 → 30min',login_btn:'Injira →',back:'← Garuka kuri Home',welcome:'✅ Urakaza neza Admin!',go_admin:'👉 Jya muri Admin Dashboard',logout:'🚪 Sohoka'},Kiswahili:{lang_label:'Badilisha Lugha:',admin:'🔐 Admin',admin_sub:'SendMoney - Wewe tu • Block 4 → 30min',login_btn:'Ingia →',back:'← Rudi Nyumbani',welcome:'✅ Karibu Admin!',go_admin:'👉 Nenda kwa Dashibodi ya Admin',logout:'🚪 Toka'},Lingala:{lang_label:'Changer Monoko:',admin:'🔐 Admin',admin_sub:'SendMoney - Yo kaka • Block 4 → 30min',login_btn:'Kota →',back:'← Zonga na Home',welcome:'✅ Boyei malamu Admin!',go_admin:'👉 Kende na Dashboard ya Admin',logout:'🚪 Kobima'},Luganda:{lang_label:'Kyusa Olulimi:',admin:'🔐 Admin',admin_sub:'SendMoney - Ggwe yekka • Block 4 → 30min',login_btn:'Yingira →',back:'← Dda ku Home',welcome:'✅ Tukwaniriza Admin!',go_admin:'👉 Genda ku Dashboard ya Admin',logout:'🚪 Fuluma'}};
function changeSiteLang(){const l=document.getElementById('siteLang').value;localStorage.setItem('sm_lang',l);applyLang(l);}function applyLang(l){const d=T[l]||T['Kirundi'];document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t'); if(d[k]) el.textContent=d[k];});}
const _sl=localStorage.getItem('sm_lang');if(_sl){document.getElementById('siteLang').value=_sl;applyLang(_sl);}
async function adminLogin(){const p=document.getElementById('adminPass').value;const c=document.getElementById('adminCode').value;const m=document.getElementById('adminMsg');if(!p||!c)return m.textContent='Andika password + code!';m.textContent='Tegereza...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p,code:c})});const d=await r.json();m.textContent=d.message||'';if(r.ok){localStorage.setItem('sm_admin','yes');document.getElementById('loginCard').style.display='none';document.getElementById('adminDash').style.display='block';}}catch(e){m.textContent='Server ntiraboneka!';}}function logout(){localStorage.removeItem('sm_admin');location.reload();}if(localStorage.getItem('sm_admin')==='yes'){document.getElementById('loginCard').style.display='none';document.getElementById('adminDash').style.display='block';}</script></body></html>
