<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - SendMoney</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:#0B8A3E;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}.card{background:#fff;padding:30px;border-radius:16px;width:100%;max-width:400px;text-align:center}.card img{width:80px;height:80px;border-radius:50%;border:3px solid #FFD700}.card h2{color:#0B8A3E;margin:10px 0}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0}.btn{background:#0B8A3E;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;width:100%;cursor:pointer;font-size:16px}</style></head><body>
<div class="card"><img src="logo3.png"><h2>🔐 Admin — SendMoney</h2><p style="font-size:13px;color:#666">Wewe wenyene — Ntusangize iyi link!</p><input id="adminPass" type="password" placeholder="Password ya Admin"><input id="admin2fa" type="password" placeholder="Code 2FA (4 chiffres)" maxlength="4" inputmode="numeric"><button class="btn" onclick="loginAdmin()">Injira →</button><p id="msg" style="font-weight:700;margin-top:12px"></p></div>
<script>async function loginAdmin(){const password=document.getElementById('adminPass').value;const code2fa=document.getElementById('admin2fa').value;if(!password||!code2fa) return document.getElementById('msg').textContent='Uzuza Password + 2FA!';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,code2fa})});const d=await r.json();document.getElementById('msg').textContent=d.message||'';if(r.ok){localStorage.setItem('sm_admin','ok');window.location.href='/admin.html';}}</script></body></html>
