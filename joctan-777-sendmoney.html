<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:#0B8A3E;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;padding:30px;border-radius:16px;width:90%;max-width:400px;text-align:center}.card h1{color:#0B8A3E}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0}.btn{background:#0B8A3E;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;width:100%;cursor:pointer}</style></head><body>
<div class="card" id="loginCard"><h1>🔐 Admin</h1><p style="font-size:13px;color:#666">SendMoney - Gusa wewe</p><input id="adminPass" type="password" placeholder="Password ya Admin"><input id="adminCode" type="password" placeholder="Code 2FA (1357)" maxlength="4" inputmode="numeric"><button class="btn" type="button" onclick="adminLogin()">Injira →</button><p id="adminMsg" style="font-weight:700;margin-top:10px"></p><a href="/" style="color:#0B8A3E">← Garuka kuri Home</a></div>
<div class="card" id="adminDash" style="display:none"><h1>✅ Urakaza neza Admin!</h1><button class="btn" onclick="location.href='admin.html'">👉 Jya muri Admin Dashboard</button><button class="btn" style="background:#FFD700;color:#000;margin-top:10px" onclick="logout()">🚪 Sohoka</button></div>
<script>async function adminLogin(){ const p=document.getElementById('adminPass').value; const c=document.getElementById('adminCode').value; const m=document.getElementById('adminMsg'); if(!p||!c) return m.textContent='Andika password + code!'; m.textContent='Tegereza...'; try{ const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p,code:c})}); const d=await r.json(); m.textContent=d.message||''; if(r.ok){ localStorage.setItem('sm_admin','yes'); document.getElementById('loginCard').style.display='none'; document.getElementById('adminDash').style.display='block'; } }catch(e){ m.textContent='Server ntiraboneka!'; } }function logout(){ localStorage.removeItem('sm_admin'); location.reload(); }if(localStorage.getItem('sm_admin')==='yes'){ document.getElementById('loginCard').style.display='none'; document.getElementById('adminDash').style.display='block'; }</script></body></html>
