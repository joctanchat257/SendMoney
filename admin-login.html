<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - SendMoney</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:linear-gradient(135deg,#0B8A3E,#FFD700);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#fff;padding:35px;border-radius:20px;width:100%;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}.logo{font-size:50px}.box h1{color:#0B8A3E;margin:10px 0}.box p{color:#666;margin-bottom:20px}.box input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;font-size:16px}.box button{width:100%;padding:14px;background:#0B8A3E;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}.box button:hover{background:#096e31}.back{margin-top:15px;display:block;color:#0B8A3E;text-decoration:none;font-weight:700}#msg{margin-top:12px;font-weight:700;color:#f44336;min-height:20px}#step2{display:none}.info{background:#fffbe6;padding:12px;border-radius:10px;font-size:13px;margin-bottom:15px;line-height:1.5}</style></head><body><div class="box"><div class="logo">💸</div><h1>SendMoney</h1><p>Admin Gusa - Joctan</p><div id="step1"><div class="info">🔒 <b>Intambwe 1 / 2:</b> Shiramwo Password ya Admin</div><input id="pwd" type="password" placeholder="Password ya Admin"><button onclick="checkStep1()">Injira →</button></div><div id="step2"><div class="info">🛡️ <b>Intambwe 2 / 2 - 2FA:</b> Shiramwo Code ya 2FA (4 chiffres). Iyi code ni wewe gusa uyizi! Niyo umuntu azi password yawe, ntashobora kwinjira atayifise!</div><input id="code2fa" type="password" placeholder="Code ya 2FA - 4 chiffres" inputmode="numeric" maxlength="4"><button onclick="checkStep2()">Emeza 2FA → Injira</button><p style="margin-top:10px"><a href="#" onclick="document.getElementById('step2').style.display='none';document.getElementById('step1').style.display='block';return false">← Garuka</a></p></div><div id="msg"></div><a class="back" href="/">← Garuka Ahabanza</a></div>
<script>let savedPwd='';
async function checkStep1(){ const password=document.getElementById('pwd').value; if(!password) return document.getElementById('msg').textContent='Uzuza Password!'; const r=await fetch('/api/admin/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}); const d=await r.json(); if(d.need2fa){ savedPwd=password; document.getElementById('step1').style.display='none'; document.getElementById('step2').style.display='block'; document.getElementById('msg').textContent=''; document.getElementById('code2fa').focus(); } else { document.getElementById('msg').textContent=d.message||'Password nabi!'; } }
async function checkStep2(){ const code2fa=document.getElementById('code2fa').value; if(!code2fa) return document.getElementById('msg').textContent='Uzuza Code ya 2FA!'; const r=await fetch('/api/admin/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:savedPwd, code2fa})}); const d=await r.json(); if(!r.ok){ document.getElementById('msg').textContent=d.message; return; } window.location.href='/admin.html'; }
</script></body></html>
