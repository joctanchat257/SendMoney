<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - SendMoney</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.card{background:#fff;padding:30px;border-radius:15px;max-width:400px;width:100%;text-align:center}.card input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;font-size:16px}.card button{background:#0B8A3E;color:#fff;width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.msg{margin-top:12px;padding:12px;border-radius:10px;display:none}.msg.error{background:#f8d7da;color:#721c24;display:block}.field label{display:block;font-weight:700;font-size:13px;margin:0 0 5px;text-align:left}</style></head><body>
<div class="card"><h2 style="color:#0B8A3E;margin-bottom:15px">Admin - Injira</h2><div class="field"><label>Password ya Admin:</label><input id="adminPass" type="password" placeholder="Password" /></div><button onclick="loginAdmin()">Injira</button><div id="msg" class="msg"></div><p style="margin-top:12px;font-size:13px"><a href="/">Subira Ahabanza</a></p></div>
<script>async function loginAdmin(){ var password=document.getElementById('adminPass').value; var m=document.getElementById('msg'); try{ var r=await fetch('/api/admin/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}); var d=await r.json(); if(!r.ok){ m.className='msg error'; m.textContent='Password nabi!'; return; } window.location.href='admin.html'; }catch(e){ m.className='msg error'; m.textContent='Habaye ikibazo'; } }</script></body></html>
