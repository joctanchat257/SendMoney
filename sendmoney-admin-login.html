<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:400px;margin:40px auto;background:#fff;border-radius:16px;padding:20px}button{padding:12px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;width:100%;margin-top:10px}input{padding:12px;border:1px solid #ddd;border-radius:12px;width:100%;margin-top:8px;box-sizing:border-box}label{font-weight:700;font-size:13px}.pw{position:relative}.eye{position:absolute;right:8px;top:14px;width:auto;padding:4px 8px;background:#eee;color:#000}</style></head><body><div class="card"><h2>Admin Login</h2><label>Password</label><div class="pw"><input id="password" type="password" placeholder=""><button type="button" class="eye" onclick="togglePw('password',this)">👁️</button></div><label>Code 2FA</label><div class="pw"><input id="code" type="password" inputmode="numeric" placeholder=""><button type="button" class="eye" onclick="togglePw('code',this)">👁️</button></div><button onclick="login()">Injira</button></div><script>function togglePw(id,btn){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}async function login(){const password=document.getElementById('password').value;const code=document.getElementById('code').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,code})});const d=await r.json();alert(d.message);if(d.success) location.href='admin.html';}</script></body></html>
