<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - SendMoney</title><style>body{margin:0;font-family:Arial;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:400px}button{padding:12px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;width:100%;margin-top:10px;cursor:pointer}input{padding:12px;border:1px solid #ddd;border-radius:12px;width:100%;margin-top:8px;box-sizing:border-box}label{font-weight:700;font-size:13px}.pw{position:relative}.eye{position:absolute;right:8px;top:14px;width:auto;padding:4px 8px;background:#eee;color:#000}</style></head><body><div class="card"><h2>Admin Login</h2>
<label>Phone Admin</label><input id="phone" type="tel" placeholder="">
<label>Password Admin</label><div class="pw"><input id="pass" type="password" maxlength="4" placeholder=""><button type="button" class="eye" onclick="togglePw('pass',this)">👁️</button></div>
<label>Code 2FA</label><div class="pw"><input id="code" type="password" placeholder=""><button type="button" class="eye" onclick="togglePw('code',this)">👁️</button></div>
<button onclick="adminLogin()">Injira</button></div><script>
function togglePw(id,btn){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}
async function adminLogin(){
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('pass').value.trim();
  const code2fa=document.getElementById('code').value.trim();
  if(!phone) return alert('Andika Phone Admin!');
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password,code2fa})});
  const d=await r.json(); alert(d.message);
  if(d.success){localStorage.setItem('me',JSON.stringify(d.user)); location.href='admin.html';}
}
</script></body></html>
