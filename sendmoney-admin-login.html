<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:400px;margin:40px auto;background:#fff;border-radius:16px;padding:20px}label{font-weight:700;font-size:13px;margin-top:12px;display:block}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:6px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;margin-top:14px}.pw{position:relative}.pw input{padding-right:48px}.eye{position:absolute;right:6px;top:6px;width:40px;height:40px;padding:0;background:#eef3ff;color:#111;border-radius:10px;font-size:18px;margin:0}</style></head><body><div class="card"><h2>Admin Login</h2>
<label>Password ya Admin</label><div class="pw"><input id="password" type="password" inputmode="numeric" placeholder="Andika Password"><button type="button" class="eye" onclick="togglePw('password',this)">👁️</button></div>
<label>Code ya 2FA</label><div class="pw"><input id="code" type="password" inputmode="numeric" maxlength="4" placeholder="Andika Code"><button type="button" class="eye" onclick="togglePw('code',this)">👁️</button></div>
<button onclick="login()">Injira nka Admin</button><div id="msg" style="font-weight:700;text-align:center;margin-top:10px"></div></div>
<script>function togglePw(id,btn){var el=document.getElementById(id);if(el.type==='password'){el.type='text';btn.textContent='🙈';}else{el.type='password';btn.textContent='👁️';}}
async function login(){const password=document.getElementById('password').value.trim();const code=document.getElementById('code').value.trim();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,code})});const d=await r.json();document.getElementById('msg').innerText=d.message;if(r.ok) setTimeout(()=>location.href='admin.html',800)}</script></body></html>
