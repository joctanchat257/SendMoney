<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Super Agent - SendMoney</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:#f5f5f5}.top{background:#0B8A3E;color:#fff;padding:15px;display:flex;justify-content:space-between}.wrap{max-width:800px;margin:0 auto;padding:15px}.card{background:#fff;padding:20px;border-radius:14px;margin:12px 0}.card h2{color:#0B8A3E}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.btn{background:#0B8A3E;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;width:100%;cursor:pointer}.btn-gold{background:#FFD700;color:#000;border:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #eee}</style></head><body>
<div class="top"><b>⭐ SendMoney - Super Agent</b><a href="/" style="color:#FFD700;font-weight:700;text-decoration:none">← Home</a></div>
<div class="wrap"><div class="card" id="loginCard"><h2>🔐 Injira — Super Agent</h2><input id="loginPhone" placeholder="Numero"><input id="loginPass" type="password" placeholder="Password 4" maxlength="4" inputmode="numeric"><button class="btn" onclick="login()">Injira →</button><p id="loginMsg" style="font-weight:700;margin-top:10px"></p></div>
<div id="dash" style="display:none"><div class="card"><h2>👋 <span id="userName"></span></h2><p>Numero: <b id="userPhone"></b></p><p>Commission Total: <b id="userComm" style="font-size:24px;color:#0B8A3E">0 BIF</b></p><p>Commission Uyu musi: <b id="todayComm">0</b> / Max 30,000 BIF</p></div>
<div class="card"><h2>🧑‍💼 Agents Bawe</h2><div style="overflow-x:auto"><table><thead><tr><th>Izina</th><th>Numero</th><th>Province</th><th>Commission</th></tr></thead><tbody id="agentBody"></tbody></table></div></div>
<div class="card"><h2>💸 Transactions</h2><div style="overflow-x:auto"><table><thead><tr><th>Code</th><th>Sender</th><th>Amount</th><th>Fee</th><th>Commission Yawe (20%)</th></tr></thead><tbody id="txBody"></tbody></table></div><button class="btn-gold" onclick="loadAll()" style="margin-top:10px">🔄 Refresh</button></div>
<button class="btn-gold" onclick="logout()">🚪 Sohoka</button></div></div>
<script>let me=null;async function login(){const phone=document.getElementById('loginPhone').value.trim();const password=document.getElementById('loginPass').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password,role:'super_agent'})});const d=await r.json();document.getElementById('loginMsg').textContent=d.message||'';if(r.ok){me=d.user||d;localStorage.setItem('sm_super',JSON.stringify(me));showDash();}}function showDash(){if(!me) return;document.getElementById('loginCard').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('userName').textContent=me.full_name||'';document.getElementById('userPhone').textContent=me.phone||'';document.getElementById('userComm').textContent=Number(me.commission||0).toLocaleString()+' BIF';loadAll();}async function loadAll(){const [a,t]=await Promise.all([fetch('/api/super/agents').then(r=>r.json()).catch(()=>[]),fetch('/api/super/transactions?phone='+encodeURIComponent(me.phone)).then(r=>r.json()).catch(()=>[])]);const agents=Array.isArray(a)?a:(a.agents||[]);const txs=Array.isArray(t)?t:(t.transactions||[]);document.getElementById('agentBody').innerHTML=agents.map(x=>`<tr><td>${x.full_name||''}</td><td>${x.phone||''}</td><td>${x.province||''}</td><td>${Number(x.commission||0).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4">Nta Agent</td></tr>';let today=0;const ts=new Date().toISOString().slice(0,10);txs.forEach(x=>{if((x.created_at||'').slice(0,10)===ts) today+=Number(x.fee||0)*0.2;});document.getElementById('todayComm').textContent=Math.round(today).toLocaleString()+' BIF';document.getElementById('txBody').innerHTML=txs.map(x=>`<tr><td>${x.code||''}</td><td>${x.sender_phone||''}</td><td>${Number(x.amount||0).toLocaleString()}</td><td>${Number(x.fee||0).toLocaleString()}</td><td>${Math.round(Number(x.fee||0)*0.2).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5">Nta transaction</td></tr>';}function logout(){localStorage.removeItem('sm_super');location.reload();}const s=localStorage.getItem('sm_super');if(s){try{me=JSON.parse(s);showDash();}catch(e){}}</script></body></html>
