<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:900px;margin:12px auto;background:#fff;border-radius:16px;padding:16px}button{padding:10px 14px;border:0;border-radius:10px;background:#0b5cff;color:#fff;font-weight:700;margin:4px;cursor:pointer}.b2{background:#111}.bg{background:#34c759}.br{background:#ff3b30}.box{background:#eef3ff;padding:12px;border-radius:12px;margin:10px 0}.item{border-bottom:1px solid #eee;padding:10px 0;font-size:14px}input,select{padding:10px;border:1px solid #ddd;border-radius:10px;width:100%;margin-top:6px}label{font-weight:700;font-size:13px}</style></head><body><div class="card"><h2>Admin - SendMoney</h2>
<div class="box"><h3>Commission ya Admin</h3><div>Total Fee: <b id="tf"></b> BIF</div><div>Admin (20%): <b id="at"></b> BIF</div><div>Yamaze Gukurwa: <b id="ap"></b> BIF</div><div>Isigaye: <b id="ar"></b> BIF</div><div>Total Sent: <b id="ts"></b> BIF • Transactions: <b id="tc"></b></div><label>Amafaranga yo Gukura (Admin - Igihe cose)</label><input id="adminAmt" type="number" placeholder="Andika Amafaranga"><label>Channel</label><select id="adminCh"><option>Lumicash</option><option>Ecocash</option></select><button class="bg" onclick="adminWithdraw()">Withdraw - Admin</button></div>
<div><button onclick="load('customers')">Clients</button><button onclick="load('agents')">Agents</button><button onclick="load('super-agents')">Super Agents</button><button onclick="load('transactions')">Transactions</button><button onclick="load('withdrawals')">Withdrawals</button><button onclick="load('reset')">Ibibazo 5 Reset</button><button class="b2" onclick="loadCommission()">Commission Dashboard</button></div>
<div id="out"></div></div>
<script>
async function loadCommission(){const r=await fetch('/api/admin/commission');const d=await r.json();document.getElementById('tf').innerText=Number(d.total_fee).toLocaleString();document.getElementById('at').innerText=Number(d.admin_total).toLocaleString();document.getElementById('ap').innerText=Number(d.admin_paid).toLocaleString();document.getElementById('ar').innerText=Number(d.admin_rest).toLocaleString();document.getElementById('ts').innerText=Number(d.total_sent).toLocaleString();document.getElementById('tc').innerText=d.total_count}
async function adminWithdraw(){const amount=document.getElementById('adminAmt').value;const channel=document.getElementById('adminCh').value;const r=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'SHIRA_NUMERO_YAWE',amount,channel,role:'admin'})});const d=await r.json();alert(d.message);loadCommission()}
async function load(t){let url='/api/admin/'+t;if(t==='reset') url='/api/admin/reset-requests';const r=await fetch(url);const rows=await r.json();let h='';if(t==='customers'||t==='agents'||t==='super-agents'){h=rows.map(x=>`<div class="item"><b>${x.full_name||''}</b> - ${x.phone} - ${x.status} - Balance: ${x.balance||0} - Commission: ${x.commission||0} <button onclick="act('${t}','${x.id}','approve')">Emeza</button><button class="br" onclick="act('${t}','${x.id}','block')">Block</button><button class="bg" onclick="act('${t}','${x.id}','unblock')">Unblock</button></div>`).join('')}
if(t==='transactions'){h=rows.map(x=>`<div class="item">${x.code} - ${x.sender_phone} -> ${x.receiver_phone} - ${x.amount} BIF - Fee ${x.fee} - ${x.type}</div>`).join('')}
if(t==='withdrawals'){h=rows.map(x=>`<div class="item">${x.full_name} - ${x.phone} - ${x.amount} BIF - ${x.channel} - ${x.role} - ${x.status} <button class="bg" onclick="wact('${x.id}','approve')">Emeza</button><button class="br" onclick="wact('${x.id}','reject')">Rejeter</button></div>`).join('')}
if(t==='reset'){h=rows.map(x=>`<div class="item">${x.phone} - Q1:${x.q1} Q2:${x.q2} Q3:${x.q3} Q4:${x.q4} Q5:${x.q5} <button onclick="resetPw('${x.phone}')">Reset Password</button></div>`).join('')}
document.getElementById('out').innerHTML=h||'Nta kintu'}
async function act(t,id,a){await fetch(`/api/admin/${t}/${id}/${a}`,{method:'POST'});alert('Vyagenze!');load(t)}
async function wact(id,a){await fetch(`/api/admin/withdrawals/${id}/${a}`,{method:'POST'});alert('Vyagenze!');load('withdrawals')}
async function resetPw(phone){const np=prompt('Andika Password nshasha (4 chiffres) kuri '+phone);if(!np) return;const r=await fetch('/api/admin/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,new_password:np})});const d=await r.json();alert(d.message)}
loadCommission()
</script></body></html>
