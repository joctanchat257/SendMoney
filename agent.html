<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:480px;margin:12px auto;background:#fff;border-radius:16px;padding:16px}label{font-weight:700;font-size:13px;margin-top:12px;display:block}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:6px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;margin-top:12px}.b2{background:#111}.row{display:flex;gap:8px}.row select{width:110px}.row input{flex:1}.support{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.support a{display:block;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:800;color:#fff}</style></head><body><div class="card"><h2>Agent</h2>
<h3>Iyandikishe</h3><label>Izina</label><input id="izina" type="text" placeholder="Andika Izina"><label>Amatazirano</label><input id="amatazirano" type="text" placeholder="Andika Amatazirano"><label>Numero</label><div class="row"><select id="codeR"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="phoneR" type="tel" placeholder="Andika Numero"></div><label>Password (4 chiffres)</label><input id="passR" type="text" inputmode="numeric" maxlength="4" placeholder="Andika Password"><label>Province</label><input id="province" type="text" placeholder="Andika Province"><button onclick="reg()">Iyandikishe nka Agent</button>
<hr><h3>Injira</h3><label>Numero</label><div class="row"><select id="code"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="phone" type="tel" placeholder="Andika Numero"></div><label>Password</label><input id="password" type="text" inputmode="numeric" maxlength="4" placeholder="Andika Password"><button onclick="login()">Injira</button><div id="msg" style="font-weight:700;text-align:center"></div>
<div id="dash" style="display:none"><p>Izina: <b id="uname"></b></p><p>Commission: <b id="comm"></b> BIF</p><label>Amafaranga yo Gukura (Max 100,000 - Ku wa 1-5 gusa)</label><input id="wAmt" type="number" placeholder="Andika Amafaranga"><label>Channel</label><select id="wCh"><option>Lumicash</option><option>Ecocash</option></select><label>PIN</label><input id="pin" type="text" inputmode="numeric" maxlength="4" placeholder="Andika PIN"><button class="b2" onclick="withdraw()">Withdraw Commission</button></div>
<div class="support"><a href="tel:+25767899429" style="background:#0b5cff">📞 Hamagara</a><a href="https://wa.me/25767899429?text=Muraho%20SendMoney%2C%20ndakeneye%20ubufasha" target="_blank" style="background:#25D366">💬 WhatsApp</a></div></div>
<script>let me=null;
async function reg(){const izina=document.getElementById('izina').value.trim();const amatazirano=document.getElementById('amatazirano').value.trim();const phone=document.getElementById('codeR').value+document.getElementById('phoneR').value.trim();const password=document.getElementById('passR').value.trim();const province=document.getElementById('province').value.trim();const r=await fetch('/api/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({izina,amatazirano,phone,password,province})});const d=await r.json();alert(d.message)}
async function login(){const phone=document.getElementById('code').value+document.getElementById('phone').value.trim();const password=document.getElementById('password').value.trim();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password,role:'agent'})});const d=await r.json();document.getElementById('msg').innerText=d.message;if(r.ok){me=d.user;document.getElementById('dash').style.display='block';document.getElementById('uname').innerText=me.full_name;document.getElementById('comm').innerText=Number(me.commission||0).toLocaleString()}}
async function withdraw(){const amount=document.getElementById('wAmt').value;const channel=document.getElementById('wCh').value;const password=document.getElementById('pin').value.trim();const r=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount,channel,password,role:'agent'})});const d=await r.json();alert(d.message)}
</script></body></html>
