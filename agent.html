<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:480px;margin:12px auto;background:#fff;border-radius:16px;padding:16px}button{padding:12px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;width:100%;margin-top:10px}.b2{background:#111}input,select{padding:12px;border:1px solid #ddd;border-radius:12px;width:100%;margin-top:8px;box-sizing:border-box}label{font-weight:700;font-size:13px}.pw{position:relative}.eye{position:absolute;right:8px;top:14px;width:auto;padding:4px 8px;background:#eee;color:#000}.row{display:flex;gap:8px}.box{background:#eef3ff;padding:12px;border-radius:12px}.big{font-size:28px;font-weight:900;color:#0b5cff}.item{border-bottom:1px solid #eee;padding:8px 0;font-size:14px}</style></head><body><div class="card"><h2>Agent - SendMoney</h2><div>Izina: <b id="uName"></b> • Phone: <b id="uPhone"></b></div><div class="box">Commission Yawe: <div class="big"><span id="comm">0</span> BIF</div><div>Agent ahabwa 60% ya Fee (2%)</div></div><div style="background:#fff3cd;padding:10px;border-radius:12px;margin-top:10px;font-size:13px">Withdraw ya Commission ifungurwa gusa ku wa 1 - 5 buri kwezi! Ubu turi ku wa <b id="todayD"></b></div>
<h3>Withdraw Commission</h3><label>Amafaranga yo Gukura (Min 5,000 - Max 100,000 - Ku wa 1-5 gusa)</label><input id="wAmt" type="number" placeholder=""><label>Hitamo umuhora ushaka kurotirirako</label><select id="wCh"><option value="">-- Hitamo --</option><option>Lumicash</option><option>Ecocash</option><option>MTN</option><option> Airtel</option></select><label>Numero ushaka kurotirirako</label><div class="row"><select id="wCode"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="wDest" type="tel" placeholder=""></div><label>PIN</label><div class="pw"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder=""><button type="button" class="eye" onclick="togglePw('pin',this)">👁️</button></div><button class="b2" onclick="withdraw()">Withdraw Commission</button>
<h3>Transactions</h3><div id="hist"></div><h3>Withdraws Zanje</h3><div id="wdHist"></div><button class="b2" onclick="location.href='index.html'">Sohoka</button></div><script>
function safeNum(v){const n=Number(v||0);return isNaN(n)?0:n;}
let me=JSON.parse(localStorage.getItem('me')||'{}');
function togglePw(id,btn){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}
document.getElementById('todayD').innerText=new Date().getDate();
async function refresh(){try{const r=await fetch('/api/admin/agents');const rows=await r.json();const f=(rows||[]).find(x=>x.phone===me.phone);if(f){me=f;localStorage.setItem('me',JSON.stringify(f));}}catch(e){}document.getElementById('uName').innerText=me.full_name||'';document.getElementById('uPhone').innerText=me.phone||'';document.getElementById('comm').innerText=safeNum(me.commission).toLocaleString();}
async function withdraw(){const amount=safeNum(document.getElementById('wAmt').value);if(!amount) return alert('Andika Amafaranga!');const channel=document.getElementById('wCh').value;if(!channel) return alert('Hitamo umuhora ushaka kurotirirako!');const destination_phone=document.getElementById('wCode').value+document.getElementById('wDest').value.trim();if(!document.getElementById('wDest').value.trim()) return alert('Andika numero ushaka kurotirirako!');const password=document.getElementById('pin').value.trim();if(!password) return alert('Andika PIN!');const r=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount,channel,destination_phone,password,role:'agent'})});const d=await r.json();alert(d.message);if(r.ok){refresh();loadWd();}}
async function loadHist(){try{const r=await fetch('/api/agent/transactions');const rows=await r.json();document.getElementById('hist').innerHTML=(rows||[]).slice(0,20).map(x=>`<div class="item">${x.code||''} - ${x.sender_phone||''} -> ${x.receiver_phone||''} - ${safeNum(x.amount).toLocaleString()} BIF - Fee ${safeNum(x.fee)}</div>`).join('')||'Nta kintu';}catch(e){document.getElementById('hist').innerText='Nta kintu';}}
async function loadWd(){try{const r=await fetch('/api/withdrawals?phone='+encodeURIComponent(me.phone||'')+'&role=agent');const rows=await r.json();document.getElementById('wdHist').innerHTML=(rows||[]).map(x=>`<div class="item">${safeNum(x.amount).toLocaleString()} BIF - ${x.channel||''} -> ${x.destination_phone||''} - ${x.status||''}</div>`).join('')||'Nta kintu';}catch(e){document.getElementById('wdHist').innerText='Nta kintu';}}
refresh();loadHist();loadWd();
</script></body></html>
