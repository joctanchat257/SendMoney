<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:480px;margin:12px auto;background:#fff;border-radius:16px;padding:16px}button{padding:12px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;width:100%;margin-top:10px}.b2{background:#111}.bg{background:#34c759}.bo{background:#ff9500}input,select{padding:12px;border:1px solid #ddd;border-radius:12px;width:100%;margin-top:8px;box-sizing:border-box}label{font-weight:700;font-size:13px}.pw{position:relative}.eye{position:absolute;right:8px;top:14px;width:auto;padding:4px 8px;background:#eee;color:#000}.row{display:flex;gap:8px}.box{background:#eef3ff;padding:12px;border-radius:12px;margin-top:10px}.ok{background:#e8f5e9;border:2px solid #34c759;padding:12px;border-radius:12px;display:none}.fail{background:#ffe8e8;border:2px solid #ff3b30;padding:12px;border-radius:12px;display:none}.item{border-bottom:1px solid #eee;padding:8px 0;font-size:14px}</style></head><body><div class="card"><h2>SendMoney - Client</h2><div>Izina: <b id="uName"></b> • Phone: <b id="uPhone"></b></div><div class="box">Balance: <b id="bal">0</b> BIF • Bonus: <b id="bonus">0</b> • Airtime: <b id="airN">0</b>/2 • Invite: <b id="myCode"></b></div>
<div id="okBox" class="ok"><h3>✅ BIKUNZE!</h3><div>Amafaranga: <b id="okAmt"></b> BIF</div><div>Fee: <b id="okFee"></b> BIF</div><div>Uwarungikiwe: <b id="okRecv"></b></div><div>Code: <b id="okCode"></b></div><button class="bg" onclick="shareWhats()">📲 Sangira kuri WhatsApp</button><button onclick="dlReceipt()">📄 Telecharger Receipt PDF</button></div>
<div id="failBox" class="fail"><h3>❌ NTIBIKUNZE!</h3><div id="failReason"></div></div>
<h3>Rungika Amafaranga</h3><label>Numero y'Uwarungikiwe</label><div class="row"><select id="rCode"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="recv" type="tel" placeholder=""></div><label>Amafaranga (Max 200,000)</label><input id="amt" type="number" placeholder=""><label>PIN (4 chiffres)</label><div class="pw"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder=""><button type="button" class="eye" onclick="togglePw('pin',this)">👁️</button></div><button onclick="confirmSend()">Rungika</button>
<h3>Gura Airtime</h3><label>Amafaranga ya Airtime</label><input id="airAmt" type="number" placeholder=""><button class="bo" onclick="buyAirtime()">Gura Airtime</button>
<h3>Kura Amafaranga (Withdraw)</h3><label>Amafaranga (Min 5,000 - Max 100,000)</label><input id="wAmt" type="number" placeholder=""><label>Hitamo umuhora ushaka kurotirirako</label><select id="wCh"><option value="">-- Hitamo --</option><option>Lumicash</option><option>Ecocash</option><option>MTN</option><option>Airtel</option></select><label>Numero ushaka kurotirirako</label><div class="row"><select id="wCode"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="wDest" type="tel" placeholder=""></div><button class="b2" onclick="withdraw()">Withdraw</button>
<h3>Historique</h3><div id="hist"></div><h3>Withdraws Zanje</h3><div id="wdHist"></div><button class="b2" onclick="location.href='index.html'">Sohoka</button></div><script>
let me=JSON.parse(localStorage.getItem('me')||'{}');let lastReceipt=null;
function togglePw(id,btn){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}
function showUser(){document.getElementById('uName').innerText=me.full_name||'';document.getElementById('uPhone').innerText=me.phone||'';document.getElementById('bal').innerText=Number(me.balance||0).toLocaleString();document.getElementById('bonus').innerText=Number(me.bonus||0).toLocaleString();document.getElementById('airN').innerText=me.airtime_count||0;document.getElementById('myCode').innerText=me.referral_code||'';}
async function refresh(){const r=await fetch('/api/admin/customers');const rows=await r.json();const f=rows.find(x=>x.phone===me.phone);if(f){me=f;localStorage.setItem('me',JSON.stringify(f));showUser();}}
async function confirmSend(){const recv=document.getElementById('rCode').value+document.getElementById('recv').value.trim();const amount=document.getElementById('amt').value;const pin=document.getElementById('pin').value.trim();if(!document.getElementById('recv').value.trim()) return alert('Andika numero!');if(!amount) return alert('Andika Amafaranga!');const ok=confirm('Urashaka kurungika '+Number(amount).toLocaleString()+' BIF kuri '+recv+' ?');if(!ok) return;const ego=confirm('Izina ni '+recv+' ? Kanda Ego niba ari Yo, Oya niba atari Yo.');if(!ego) return;const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_phone:me.phone,receiver_phone:recv,amount,pin})});const d=await r.json();if(r.ok){document.getElementById('okBox').style.display='block';document.getElementById('failBox').style.display='none';document.getElementById('okAmt').innerText=Number(d.amount).toLocaleString();document.getElementById('okFee').innerText=Number(d.fee).toLocaleString();document.getElementById('okRecv').innerText=d.receiver;document.getElementById('okCode').innerText=d.code;lastReceipt=d;refresh();loadHist();}else{document.getElementById('failBox').style.display='block';document.getElementById('failReason').innerText=d.message;}}
async function buyAirtime(){const amount=document.getElementById('airAmt').value;const pin=document.getElementById('pin').value.trim();if(!amount) return alert('Andika Amafaranga!');const r=await fetch('/api/airtime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount,pin})});const d=await r.json();alert(d.message);if(r.ok) refresh();}
async function withdraw(){const amount=document.getElementById('wAmt').value;if(!amount) return alert('Andika Amafaranga!');const channel=document.getElementById('wCh').value;if(!channel) return alert('Hitamo umuhora!');const dest=document.getElementById('wCode').value+document.getElementById('wDest').value.trim();if(!document.getElementById('wDest').value.trim()) return alert('Andika numero ushaka kurotirirako!');const password=document.getElementById('pin').value.trim();if(!password) return alert('Andika PIN!');const r=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount,channel,destination_phone:dest,password,role:'client'})});const d=await r.json();alert(d.message);if(r.ok) loadWd();}
async function loadHist(){const r=await fetch('/api/client/transactions?phone='+encodeURIComponent(me.phone));const rows=await r.json();document.getElementById('hist').innerHTML=rows.map(x=>`<div class="item">${x.code} - ${x.sender_phone} -> ${x.receiver_phone} - ${Number(x.amount).toLocaleString()} BIF - Fee ${x.fee} - ${x.type} - ${new Date(x.created_at).toLocaleString()}</div>`).join('')||'Nta kintu';}
async function loadWd(){const r=await fetch('/api/withdrawals?phone='+encodeURIComponent(me.phone)+'&role=client');const rows=await r.json();document.getElementById('wdHist').innerHTML=rows.map(x=>`<div class="item">${Number(x.amount).toLocaleString()} BIF - ${x.channel} -> ${x.destination_phone||''} - ${x.status}</div>`).join('')||'Nta kintu';}
function shareWhats(){if(!lastReceipt) return;const t='SendMoney: Narungitse '+lastReceipt.amount+' BIF kuri '+lastReceipt.receiver+'. Code: '+lastReceipt.code;window.open('https://wa.me/?text='+encodeURIComponent(t));}
function dlReceipt(){if(!lastReceipt) return alert('Nta receipt!');const w=window.open('','_blank');w.document.write('<h1>SendMoney Receipt</h1><p>Code: '+lastReceipt.code+'</p><p>Sender: '+lastReceipt.sender+'</p><p>Receiver: '+lastReceipt.receiver+'</p><p>Amount: '+lastReceipt.amount+' BIF</p><p>Fee: '+lastReceipt.fee+' BIF</p>');w.print();}
showUser();refresh();loadHist();loadWd();
</script></body></html>
