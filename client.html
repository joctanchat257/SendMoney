<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mon Compte</title><link rel="stylesheet" href="style.css"><style>.wallet{background:linear-gradient(120deg,#084477,#078bc1);color:white;padding:30px;border-radius:16px;margin:20px 0}.wallet h2{font-size:36px}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.action-btn{background:white;border:1px solid #ccd9e8;padding:18px;border-radius:12px;text-align:center;cursor:pointer;font-weight:bold}</style></head><body>
<header><div class="logo">Send<span>Money</span></div><nav><a href="/">Ahabanza</a><a href="/admin-login.html">Admin</a></nav></header>
<div class="section" id="loginSection"><h2>Injira</h2><div class="panel"><label>Izina</label><input id="loginName"><label>Telefone</label><input id="loginPhone"><button class="main-btn full" onclick="login()">Injira</button><div id="loginMsg" class="result"></div></div></div>
<div class="section" id="dashboardSection" style="display:none;"><div class="wallet"><p id="userName"></p><h2 id="userBalance">500,000 BIF</h2><p id="userPhone"></p><button onclick="loadWallet()" style="background:white;color:#084477;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-top:10px;">🔄 Refresh</button></div>
<div class="actions"><div class="action-btn" onclick="document.getElementById('airtimeBox').style.display='block'">📱 Gura Unités</div><div class="action-btn" onclick="location.href='/#send'">💸 Ohereza</div><div class="action-btn" onclick="logout()">🚪 Sohoka</div></div>
<div id="airtimeBox" class="panel" style="display:none;"><h3>Gura Unités</h3><label>Telefone</label><input id="airPhone" placeholder="+257..."><label>Amount</label><input id="airAmount" type="number" placeholder="1000"><label>Operateur</label><select id="airOperator"><option>Lumitel</option><option>Econet</option><option>Smart</option></select><button class="main-btn full" onclick="buyAirtime()">Gura</button><div id="airMsg" class="result"></div><h4>Amateka ya Unités</h4><div id="airHistory"></div></div>
<div id="clientHistory" class="panel"></div></div>
<script>
let currentCustomer=null;
async function login(){const n=loginName.value.trim(),p=loginPhone.value.trim(),m=loginMsg;if(!n||!p){m.textContent='Uzuza';m.className='result show error';m.style.display='block';return;}m.textContent='Turiko...';m.style.display='block';try{const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:n,phone:p})});const data=await res.json();if(!res.ok) throw new Error(data.message);currentCustomer=data.customer;loginSection.style.display='none';dashboardSection.style.display='block';userName.textContent=data.customer.full_name;userPhone.textContent=data.customer.phone;clientHistory.innerHTML=(data.transactions||[]).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><div><b>${x.code}</b><br><small>${x.from_country}→${x.to_country}</small></div><div>${Number(x.amount).toLocaleString()} BIF</div></div>`).join('')||'Nta';loadWallet();loadAirtimeHistory();}catch(e){m.textContent=e.message;m.className='result show error';}}
async function loadWallet(){if(!currentCustomer) return;const res=await fetch(`/api/wallet/${currentCustomer.id}`);const data=await res.json();userBalance.textContent=Number(data.wallet.balance).toLocaleString()+' BIF';}
async function buyAirtime(){const phone=airPhone.value.trim(),amount=airAmount.value,operator=airOperator.value,msg=airMsg;if(!phone||!amount){msg.textContent='Uzuza';msg.className='result show error';msg.style.display='block';return;}msg.textContent='Turiko...';msg.style.display='block';try{const res=await fetch('/api/airtime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:currentCustomer.id,phone,amount,operator})});const data=await res.json();if(!res.ok) throw new Error(data.message);msg.textContent=data.message;msg.className='result show success';loadWallet();loadAirtimeHistory();}catch(e){msg.textContent=e.message;msg.className='result show error';}}
async function loadAirtimeHistory(){if(!currentCustomer) return;const res=await fetch(`/api/airtime/${currentCustomer.id}`);const data=await res.json();airHistory.innerHTML=(data.purchases||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${p.phone} - ${p.operator}</span><span>${Number(p.amount).toLocaleString()} BIF</span></div>`).join('')||'Nta';}
function logout(){dashboardSection.style.display='none';loginSection.style.display='block';}
</script></body></html>
