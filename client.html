<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Client - SendMoney</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{background:#f5f5f5}.top{background:#0B8A3E;color:#fff;padding:15px;display:flex;justify-content:space-between}.wrap{max-width:800px;margin:0 auto;padding:15px}.card{background:#fff;padding:20px;border-radius:14px;margin:12px 0}.card h2{color:#0B8A3E}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.btn{background:#0B8A3E;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;width:100%;cursor:pointer}.btn-gold{background:#FFD700;color:#000;border:none;padding:12px;border-radius:10px;font-weight:700;width:100%;cursor:pointer;margin-top:8px}.btn-wa{background:#25D366;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;width:100%;cursor:pointer;margin-top:8px}.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;background:#eee}.tabs button.active{background:#0B8A3E;color:#fff}</style></head><body>
<div class="top"><b>👤 SendMoney - Client</b><a href="/" style="color:#FFD700;font-weight:700;text-decoration:none">← Home</a></div>
<div class="wrap"><div class="card" id="loginCard"><h2>🔐 Injira</h2><input id="loginPhone" placeholder="Numero"><input id="loginPass" type="password" placeholder="Password 4" maxlength="4" inputmode="numeric"><button class="btn" type="button" onclick="login()">Injira →</button><p id="loginMsg" style="font-weight:700;margin-top:10px"></p></div>
<div id="dash" style="display:none"><div class="card"><h2>👋 <span id="userName"></span></h2><p>Numero: <b id="userPhone"></b> • Code yawe: <b id="userRef" style="color:#0B8A3E"></b></p><p>Balance: <b id="userBal" style="font-size:24px;color:#0B8A3E">0 BIF</b></p><p>Bonus: <b id="userBonus">0 BIF</b> <small>(Ifungurwa nyuma ya 2 Airtime)</small></p><button class="btn-gold" onclick="shareRef()">📤 Sangiza Code Yawe - Ronka 200 BIF</button></div>
<div class="tabs"><button id="tbSend" class="active" onclick="showTab('send')">💸 Rungika</button><button id="tbWd" onclick="showTab('wd')">💰 Withdraw</button></div>
<div class="card" id="tab-send"><h2>💸 Rungika Amafaranga</h2><label>Numero y'uwo urungikira:</label><input id="toPhone" placeholder="+257..."><label>Amount (BIF):</label><input id="amount" type="number" placeholder="Ex: 20000"><p>Fee (2%): <b id="feeTxt">0 BIF</b> • Total: <b id="totalTxt">0 BIF</b></p><label>PIN (Password 4):</label><input id="pin" type="password" placeholder="1234" maxlength="4" inputmode="numeric"><button class="btn" onclick="doSend()">💸 Rungika →</button><p id="sendMsg" style="font-weight:700;margin-top:10px"></p><div id="receipt" style="display:none;background:#e8f5e9;padding:15px;border-radius:12px;margin-top:12px"><h3>✅ Vyarungitswe!</h3><p>Code: <b id="rCode"></b></p><p>Amount: <b id="rAmt"></b></p><button class="btn-wa" onclick="shareWA()">📤 Sangiza kuri WhatsApp</button></div></div>
<div class="card" id="tab-wd" style="display:none"><h2>💰 Withdraw</h2><p style="font-size:13px;color:#666">Min 5,000 • Max 100,000 / jour • Igihe cose</p><input id="wdAmount" type="number" placeholder="Amount"><select id="wdChannel"><option>Lumicash</option><option>Ecocash</option><option>Bancobu eNoti</option><option>BCB Mobile</option><option>KCB Mobi</option><option>Airtel Money</option><option>Cash</option><option>Bank Transfer</option></select><input id="wdPin" type="password" placeholder="PIN 4" maxlength="4" inputmode="numeric"><button class="btn" onclick="doWithdraw()">💰 Saba Withdraw →</button><p id="wdMsg" style="font-weight:700;margin-top:10px"></p><h3 style="margin-top:12px">📜 Withdraws Zawe:</h3><div id="wdList"></div></div>
<button class="btn-gold" onclick="logout()">🚪 Sohoka</button></div></div>
<script>let me=null,lastCode='',lastAmt=0;function showTab(t){['send','wd'].forEach(x=>{document.getElementById('tab-'+x).style.display='none';document.getElementById('tb'+x.charAt(0).toUpperCase()+x.slice(1)).classList.remove('active');});document.getElementById('tab-'+t).style.display='block';document.getElementById('tb'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');if(t==='wd') loadWd();}async function login(){ const phone=document.getElementById('loginPhone').value.trim(); const password=document.getElementById('loginPass').value.trim(); const m=document.getElementById('loginMsg'); if(!phone||!password) return m.textContent='Andika numero + password!'; m.textContent='Tegereza...'; try{ const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password,role:'client'})}); const d=await r.json(); m.textContent=d.message||''; if(r.ok){ me=d.user; localStorage.setItem('sm_client',JSON.stringify(me)); showDash(); } }catch(e){ m.textContent='Server ntiraboneka!'; } }function showDash(){ if(!me) return; document.getElementById('loginCard').style.display='none'; document.getElementById('dash').style.display='block'; document.getElementById('userName').textContent=me.full_name||''; document.getElementById('userPhone').textContent=me.phone||''; document.getElementById('userRef').textContent=me.referral_code||''; document.getElementById('userBal').textContent=Number(me.balance||0).toLocaleString()+' BIF'; document.getElementById('userBonus').textContent=Number(me.bonus||0).toLocaleString()+' BIF'; }document.getElementById('amount').addEventListener('input',()=>{ const a=Number(document.getElementById('amount').value||0); const f=Math.round(a*0.02); document.getElementById('feeTxt').textContent=f.toLocaleString()+' BIF'; document.getElementById('totalTxt').textContent=(a+f).toLocaleString()+' BIF'; });async function doSend(){ const receiver=document.getElementById('toPhone').value.trim(); const amt=Number(document.getElementById('amount').value); const pin=document.getElementById('pin').value; const m=document.getElementById('sendMsg'); if(!receiver||!amt) return m.textContent='Andika numero + amount!'; if(!confirm('Urungikira '+receiver+' - '+amt.toLocaleString()+' BIF ?\n\nEgo = Emeza\nOya = Hakanira')) return; const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_phone:me.phone,receiver_phone:receiver,amount:amt,pin})}); const d=await r.json(); m.textContent=d.message||''; if(r.ok){ lastCode=d.code; lastAmt=amt; document.getElementById('receipt').style.display='block'; document.getElementById('rCode').textContent=d.code; document.getElementById('rAmt').textContent=amt.toLocaleString()+' BIF'; } }function shareRef(){ const txt='Niyandikishe kuri SendMoney ukoresheje code yanje: '+(me.referral_code||'')+' - Ronka Bonus! https://sendmoney-5cub.onrender.com/?ref='+(me.referral_code||''); window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); }function shareWA(){ window.open('https://wa.me/?text='+encodeURIComponent('SendMoney Receipt - Code: '+lastCode+' - Amount: '+lastAmt.toLocaleString()+' BIF'),' _blank'); }async function doWithdraw(){ const amt=Number(document.getElementById('wdAmount').value); const ch=document.getElementById('wdChannel').value; const pin=document.getElementById('wdPin').value; const m=document.getElementById('wdMsg'); if(amt<5000) return m.textContent='Min 5,000 BIF!'; const r=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount:amt,channel:ch,password:pin,role:'client'})}); const d=await r.json(); m.textContent=d.message||''; if(r.ok) loadWd(); }async function loadWd(){ const r=await fetch('/api/withdrawals?phone='+encodeURIComponent(me.phone)+'&role=client'); const d=await r.json(); const list=Array.isArray(d)?d:(d.withdrawals||[]); document.getElementById('wdList').innerHTML=list.map(x=>`<p>${Number(x.amount||0).toLocaleString()} BIF - ${x.channel||''} - ${x.status==='approved'?'✅ Emejwe':x.status==='rejected'?'❌ Yahakaniwe':'⏳ Tegereza'}</p>`).join('')||'<p>Nta Withdraw</p>'; }function logout(){ localStorage.removeItem('sm_client'); location.reload(); }const s=localStorage.getItem('sm_client'); if(s){ try{ me=JSON.parse(s); showDash(); }catch(e){} }</script></body></html>
