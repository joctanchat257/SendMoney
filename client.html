<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client - SendMoney</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.card{max-width:480px;margin:12px auto;background:#fff;border-radius:16px;padding:16px}label{font-weight:700;font-size:13px;margin-top:12px;display:block}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:6px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;margin-top:12px}.b2{background:#111}.b3{background:#25D366}.row{display:flex;gap:8px}.row select{width:110px}.row input{flex:1}.box{background:#eef3ff;padding:12px;border-radius:12px;margin-top:12px}.item{border-bottom:1px solid #eee;padding:8px 0;font-size:14px}.support{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.support a{display:block;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:800;color:#fff}</style></head><body><div class="card"><h2>Client</h2>
<label>Numero yawe</label><div class="row"><select id="code"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="phone" type="tel" placeholder="Andika Numero"></div>
<label>Password (4 chiffres)</label><input id="password" type="text" inputmode="numeric" maxlength="4" placeholder="Andika Password">
<button onclick="login()">Injira</button><div id="msg" style="font-weight:700;text-align:center;margin-top:8px"></div>
<div id="dash" style="display:none"><div class="box"><b id="uname"></b><br>Balance: <b id="bal"></b> BIF • Code yawe: <b id="mycode"></b></div>
<label>Numero y'Uwo Urungikira</label><div class="row"><select id="code2"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="receiver" type="tel" placeholder="Andika Numero"></div>
<label>Amafaranga</label><input id="amount" type="number" placeholder="Andika Amafaranga">
<label>PIN (Password yawe)</label><input id="pin" type="text" inputmode="numeric" maxlength="4" placeholder="Andika PIN">
<button onclick="send()">Rungika</button><button class="b2" onclick="airtime()">Gura Airtime</button><button class="b2" onclick="withdraw()">Withdraw</button><button class="b3" onclick="share()">Sangiza WhatsApp</button><button class="b2" onclick="history()">Historique</button><button onclick="resetReq()">Ibibazo 5 - Reset Password</button>
<div class="support"><a href="tel:+25767899429" style="background:#0b5cff">📞 Hamagara</a><a href="https://wa.me/25767899429?text=Muraho%20SendMoney%2C%20ndakeneye%20ubufasha" target="_blank" style="background:#25D366">💬 WhatsApp</a></div>
<div id="hist"></div></div></div>
<script>let me=null;
async function login(){const phone=document.getElementById('code').value+document.getElementById('phone').value.trim();const password=document.getElementById('password').value.trim();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password,role:'client'})});const d=await r.json();document.getElementById('msg').innerText=d.message;if(r.ok){me=d.user;document.getElementById('dash').style.display='block';document.getElementById('uname').innerText=me.full_name;document.getElementById('bal').innerText=Number(me.balance||0).toLocaleString();document.getElementById('mycode').innerText=me.referral_code||'';}}
async function send(){const receiver_phone=document.getElementById('code2').value+document.getElementById('receiver').value.trim();const amount=document.getElementById('amount').value;const pin=document.getElementById('pin').value.trim();const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_phone:me.phone,receiver_phone,amount,pin})});const d=await r.json();alert(d.message+(d.code?' Code: '+d.code:''));if(r.ok) location.reload()}
async function airtime(){const amount=prompt('Andika Amafaranga ya Airtime:');if(!amount) return;const pin=document.getElementById('pin').value.trim();const r=await fetch('/api/airtime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount,pin})});const d=await r.json();alert(d.message);if(r.ok) location.reload()}
async function withdraw(){const amount=prompt('Andika Amafaranga yo Gukura (Min 5,000 - Max 100,000):');if(!amount) return;const channel=prompt('Channel: Lumicash / Ecocash');const password=document.getElementById('pin').value.trim();const r=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,amount,channel,password,role:'client'})});const d=await r.json();alert(d.message)}
function share(){window.open('https://wa.me/?text='+encodeURIComponent('Ngwino kuri SendMoney! Code yanje: '+(me.referral_code||'')), '_blank')}
async function history(){const r=await fetch('/api/client/transactions?phone='+me.phone);const rows=await r.json();document.getElementById('hist').innerHTML='<h3>Historique</h3>'+rows.map(x=>`<div class="item">${x.type} - ${x.amount} BIF - ${x.sender_phone} -> ${x.receiver_phone} - ${x.created_at.slice(0,16)}</div>`).join('')}
async function resetReq(){const q1=prompt('Ibibazo 1: Izina rya Mama?');const q2=prompt('Ibibazo 2: Umusi wavutseho?');const q3=prompt('Ibibazo 3: Igihugu cawe?');const q4=prompt('Ibibazo 4: Numero yawe ya kera?');const q5=prompt('Ibibazo 5: Izina ry\'umuntu wawe?');const r=await fetch('/api/reset-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,q1,q2,q3,q4,q5})});const d=await r.json();alert(d.message)}
</script></body></html>
