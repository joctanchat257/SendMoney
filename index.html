<!DOCTYPE html><html lang="rn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SendMoney</title><link rel="manifest" href="manifest.json"><style>body{margin:0;font-family:Arial;background:#f2f4f8}.splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99}.splash img{width:110px;height:110px;border-radius:50%;object-fit:cover;cursor:pointer}.logo-text{font-family:'Times New Roman',serif;font-style:italic;font-weight:900;font-size:38px}.card{max-width:480px;margin:16px auto;background:#fff;border-radius:16px;padding:16px}button{padding:12px;border:0;border-radius:12px;background:#0b5cff;color:#fff;font-weight:800;width:100%;margin-top:10px;cursor:pointer}.b2{background:#111}.bg{background:#34c759}input,select{padding:12px;border:1px solid #ddd;border-radius:12px;width:100%;margin-top:8px;box-sizing:border-box}label{font-weight:700;font-size:13px}.pw{position:relative}.eye{position:absolute;right:8px;top:14px;width:auto;padding:4px 8px;background:#eee;color:#000}.row{display:flex;gap:8px}.support{background:#eef3ff;padding:10px;border-radius:12px;text-align:center;font-size:14px}</style></head><body>
<div id="splash" class="splash"><img src="logo3.png" onclick="hideSplash()" alt="SendMoney"><div class="logo-text"><span style="color:#0b5cff">S</span><span style="color:#ff3b30">e</span><span style="color:#ff9500">n</span><span style="color:#34c759">d</span><span style="color:#0b5cff">M</span><span style="color:#ff3b30">o</span><span style="color:#ff9500">n</span><span style="color:#34c759">e</span><span style="color:#0b5cff">y</span></div><p>Kanda kuri Logo kwinjira</p></div>
<div class="card" id="main" style="display:none"><h2 style="text-align:center">SendMoney</h2>
<div style="text-align:right"><select id="langSel" onchange="setLang(this.value)"><option value="rn">Kirundi</option><option value="rw">Kinyarwanda</option><option value="sw">Kiswahili</option><option value="ln">Lingala</option><option value="lg">Luganda</option><option value="fr">Français</option><option value="en">English</option></select></div>
<div class="support">📞 Support: <a href="tel:+25767899429">+257 67899429</a> • <a href="https://wa.me/25767899429">WhatsApp</a></div>
<div id="regBox"><h3 id="tReg">Kwiyandikisha</h3>
<label id="lIzina">Izina</label><input id="izina" placeholder="">
<label id="lAmatazirano">Amatazirano</label><input id="amatazirano" placeholder="">
<label>Phone</label><div class="row"><select id="code"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="phone" placeholder=""></div>
<label>Password (4 chiffres)</label><div class="pw"><input id="password" type="password" inputmode="numeric" maxlength="4" placeholder=""><button type="button" class="eye" onclick="togglePw('password',this)">👁️</button></div>
<label>Country</label><select id="country"><option>Burundi</option><option>Rwanda</option><option>Tanzania</option><option>Congo</option><option>Uganda</option><option>Kenya</option></select>
<label>Channel</label><select id="channel"><option>Lumicash</option><option>Ecocash</option><option>MTN</option><option>Airtel</option></select>
<label>Invite Code (niba ufise)</label><input id="ref" placeholder="">
<button onclick="register()">Kwiyandikisha</button><button class="b2" onclick="showLogin()">Ndamaze kwiyandikisha — Injira</button></div>
<div id="loginBox" style="display:none"><h3>Injira</h3><label>Role</label><select id="role"><option value="client">Client</option><option value="agent">Agent</option><option value="super_agent">Super Agent</option></select><label>Phone</label><div class="row"><select id="lcode"><option value="+257">+257</option><option value="+250">+250</option><option value="+255">+255</option><option value="+243">+243</option><option value="+256">+256</option><option value="+254">+254</option></select><input id="lphone" placeholder=""></div><label>Password</label><div class="pw"><input id="lpass" type="password" inputmode="numeric" maxlength="4" placeholder=""><button type="button" class="eye" onclick="togglePw('lpass',this)">👁️</button></div><button onclick="login()">Injira</button><button class="b2" onclick="showReg()">Subira Kwiyandikisha</button><button class="bg" onclick="resetReq()">Navyibuze Password?</button></div>
</div><script>
function hideSplash(){document.getElementById('splash').style.display='none';document.getElementById('main').style.display='block';}
function togglePw(id,btn){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}
function setLang(v){localStorage.setItem('lang',v);applyLang(v);}
function applyLang(v){const t={rn:{reg:'Kwiyandikisha',izina:'Izina',amata:'Amatazirano'},rw:{reg:'Kwiyandikisha',izina:'Izina',amata:'Amazina'},sw:{reg:'Jisajili',izina:'Jina',amata:'Jina la familia'},fr:{reg:"S'inscrire",izina:'Nom',amata:'Prénom'},en:{reg:'Register',izina:'First Name',amata:'Last Name'}};const d=t[v]||t.rn;document.getElementById('tReg').innerText=d.reg;document.getElementById('lIzina').innerText=d.izina;document.getElementById('lAmatazirano').innerText=d.amata;}
function showLogin(){document.getElementById('regBox').style.display='none';document.getElementById('loginBox').style.display='block';}
function showReg(){document.getElementById('loginBox').style.display='none';document.getElementById('regBox').style.display='block';}
async function register(){const izina=document.getElementById('izina').value.trim();const amatazirano=document.getElementById('amatazirano').value.trim();const phone=document.getElementById('code').value+document.getElementById('phone').value.trim();const password=document.getElementById('password').value.trim();const country=document.getElementById('country').value;const channel=document.getElementById('channel').value;const referral_code=document.getElementById('ref').value.trim();if(!izina||!amatazirano) return alert('Andika Izina NA Amatazirano!');const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({izina,amatazirano,phone,password,country,channel,referral_code})});const d=await r.json();alert(d.message);if(d.success) showLogin();}
async function login(){const phone=document.getElementById('lcode').value+document.getElementById('lphone').value.trim();const password=document.getElementById('lpass').value.trim();const role=document.getElementById('role').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password,role})});const d=await r.json();alert(d.message);if(d.success){localStorage.setItem('me',JSON.stringify(d.user));localStorage.setItem('role',role);if(role==='client') location.href='client.html';if(role==='agent') location.href='agent.html';if(role==='super_agent') location.href='super-agent.html';}}
async function resetReq(){const phone=prompt('Andika numero yawe:');if(!phone) return;const q1=prompt('Ibibazo 1:');const q2=prompt('Ibibazo 2:');const q3=prompt('Ibibazo 3:');const q4=prompt('Ibibazo 4:');const q5=prompt('Ibibazo 5:');const r=await fetch('/api/reset-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,q1,q2,q3,q4,q5})});const d=await r.json();alert(d.message);}
const u=new URLSearchParams(location.search);if(u.get('ref')) document.getElementById('ref').value=u.get('ref');
applyLang(localStorage.getItem('lang')||'rn');document.getElementById('langSel').value=localStorage.getItem('lang')||'rn';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script></body></html>
